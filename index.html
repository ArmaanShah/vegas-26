<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#050505">
<title>Private</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 900; font-display: swap; src: url("fonts/bodoni-moda-latin-standard-italic.woff2") format("woff2-variations"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("fonts/hanken-grotesk-latin-wght-normal.woff2") format("woff2-variations"); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 24px; font: 400 1rem/1.5 "Hanken Grotesk", system-ui, sans-serif; color: #ffffff;
  background: radial-gradient(90% 60% at 50% 0%, rgba(212,175,55,.10), transparent 65%), #050505; }
.gate { width: min(400px, 100%); text-align: center; }
.chip { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%; background: #050505; border: 6px dashed #d4af37; box-shadow: 0 0 0 3px #050505, 0 0 0 4px rgba(212,175,55,.5), 0 10px 30px rgba(0,0,0,.8); }
h1 { font: italic 600 2.6rem/1.05 "Bodoni Moda", Didot, Georgia, serif; color: #d4af37; margin: 0 0 8px; }
p { color: #a1a1a6; margin: 0 0 26px; }
form { display: grid; gap: 12px; text-align: left; }
label { font-weight: 600; }
input[type=password] { width: 100%; font: inherit; font-size: 1.25rem; letter-spacing: .12em; color: #ffffff; background: #121214;
  border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 14px 16px; }
.remember { display: flex; align-items: center; gap: 10px; font-weight: 500; color: #a1a1a6; }
.remember input { width: 18px; height: 18px; accent-color: #d4af37; }
button { min-height: 50px; border: 0; border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 1.0625rem; line-height: 1; color: #050505; cursor: pointer;
  background: linear-gradient(180deg, #f1d47a, #c9a233); }
button[disabled] { opacity: .6; cursor: wait; }
.err { color: #ff6b5e; font-weight: 600; min-height: 1.5em; margin: 0; }
:focus-visible { outline: 3px solid #f5d27a; outline-offset: 3px; }
.checking .gate { visibility: hidden; }
</style>
</head>
<body class="checking">
<main class="gate">
  <div class="chip" aria-hidden="true"></div>
  <h1>Members only</h1>
  <p>Enter the passcode to come in.</p>
  <form id="gate" autocomplete="off">
    <label for="pass">Passcode</label>
    <input type="password" id="pass" name="pass" required autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">Unlock</button>
  </form>
</main>

    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
    }).then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  if (!window.crypto || !crypto.subtle) { err.textContent = "This browser can't unlock the page. Try Safari or Chrome."; reveal(); return; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    open(bytes(saved)).then(show, function () { try { localStorage.removeItem(KEY); } catch (e) {} reveal(); });
  } else { reveal(); }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = document.getElementById("pass").value;
    if (!pass) return;
    err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
    var rawKey;
    derive(pass).then(function (raw) { rawKey = raw; return open(raw); }).then(function (html) {
      if (document.getElementById("remember").checked) { try { localStorage.setItem(KEY, b64(rawKey)); } catch (e2) {} }
      show(html);
    }, function () {
      go.disabled = false; go.textContent = "Unlock";
      err.textContent = "That passcode didn't work. Check it and try again.";
      document.getElementById("pass").select();
    });
  });
})();
</script>
